# =============================================================================
# inventory/staging/hosts.yml
# =============================================================================
# A separate inventory for a staging/development environment.
# In a real project you would have different IPs, maybe fewer nodes,
# or different credentials here.
#
# You use this by temporarily changing ansible.cfg:
#   inventory = inventory/staging/
#
# Or by passing --inventory on the command line:
#   ansible-playbook -i inventory/staging/ playbooks/site.yml
# =============================================================================

---
all:
  children:
    cluster:
      children:
        control-plane:
          hosts:
            control-plane-stg:
              ansible_host: 10.0.0.10
        workers:
          hosts:
            worker-stg-01:
              ansible_host: 10.0.0.11
            worker-stg-02:
              ansible_host: 10.0.0.12