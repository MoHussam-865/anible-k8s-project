# =============================================================================
# inventory/production/hosts.yml
# =============================================================================
# This is the INVENTORY file.  It tells Ansible:
#   - What servers (hosts) exist
#   - How to reach them (IP / hostname)
#   - What groups they belong to
#   - Any host-specific variables
#
# Ansible reads this file at the START of every playbook run.
# The path is set in ansible.cfg via the 'inventory' directive.
#
# We use YAML format (instead of the older INI format) because:
#   - YAML supports structured data (lists, dictionaries)
#   - YAML is easier to version-control and diff
#   - YAML is the native Ansible language
#
# =============================================================================

---
# ---------------------------------------------------------------------------
# ALL group
# ---------------------------------------------------------------------------
# 'all' is a BUILT-IN group that contains every host automatically.
# You don't need to declare it — it always exists.
# Variables under 'all' apply to EVERY host in the inventory.
# We keep 'all' vars minimal and put environment-wide vars in group_vars/all.yml
# ---------------------------------------------------------------------------
all:
  children:
    # -----------------------------------------------------------------------
    # cluster: a parent group containing all Kubernetes nodes
    # -----------------------------------------------------------------------
    # Why create groups?
    #   1. TARGET specific subsets of hosts in a play (e.g. "only workers")
    #   2. APPLY shared variables to a group (via group_vars/)
    #   3. CREATE group hierarchies (children inherit from parents)
    #   4. CONTROL rolling updates (e.g. update workers one by one)
    #
    # Without groups you would have to list every host in every play.
    # With groups you write "hosts: all" or "hosts: workers" and Ansible
    # expands the group automatically.
    #
    # Best practice: create groups that reflect:
    #   - Function     (control-plane, workers, databases, load-balancers)
    #   - Environment  (production, staging, development)
    #   - Region       (us-east, eu-west)
    # -----------------------------------------------------------------------
    cluster:
      children:
        # -------------------------------------------------------------------
        # control-plane group
        # -------------------------------------------------------------------
        # A group for the Kubernetes Control Plane node(s).
        # In production you might have 3 or 5 control-plane nodes (HA).
        # Here we have 1 for our home lab.
        # -------------------------------------------------------------------
        control-plane:
          hosts:
            control-plane-01:
              # ansible_host: the IP or FQDN Ansible uses to SSH in.
              # If omitted, Ansible uses the inventory hostname as-is.
              # In a real lab you would replace these IPs with your VMs' IPs.
              ansible_host: 10.1.0.10
              # ansible_user can override ansible.cfg's remote_user per host.
              # We let the cfg default apply (ansible user).
              # ansible_user: ansible

        # -------------------------------------------------------------------
        # workers group
        # -------------------------------------------------------------------
        # A group for the Kubernetes Worker nodes.
        # Even though Ansible runs tasks on them in parallel, it's useful
        # to have a group so we can target them separately from the
        # control-plane node (e.g. "hosts: workers" in a play).
        # -------------------------------------------------------------------
        workers:
          hosts:
            worker-01:
              ansible_host: 10.1.0.8
            worker-02:
              ansible_host: 10.1.0.6

    # -----------------------------------------------------------------------
    # ungrouped: (implicit group)
    # -----------------------------------------------------------------------
    # Any host that is NOT a member of any user-defined group ends up in the
    # implicit 'ungrouped' group.  We have no such hosts here.
    # -----------------------------------------------------------------------

# =============================================================================
# IMPORTANT: How groups resolve
# =============================================================================
# Host "worker-01" belongs to:
#   - workers   (explicit)
#   - cluster   (inherited through parent)
#   - all       (automatic)
#
# So a play targeting "hosts: all" will run on ALL three hosts.
# A play targeting "hosts: workers" runs on worker-01 and worker-02 only.
# A play targeting "hosts: control-plane" runs on control-plane-01 only.
#
# This is why groups matter: they give you FLEXIBILITY to address exactly
# the set of hosts you need without repeating IPs.
# =============================================================================