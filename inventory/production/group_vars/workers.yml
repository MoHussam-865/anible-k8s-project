# =============================================================================
# inventory/production/group_vars/workers.yml
# =============================================================================
# Variables in this file apply ONLY to hosts in the 'workers' group.
#
# PRECEDENCE:
#   This file has HIGHER precedence than group_vars/all.yml.
#   It has LOWER precedence than worker-01.yml and worker-02.yml.
# =============================================================================

---
# The role this node plays
kubernetes_role: "worker"

# Workers might need a different containerd config than control plane
containerd_worker_config: true

# How workers discover the control plane (set at runtime via register)
control_plane_ip: "{{ hostvars['control-plane-01'].ansible_default_ipv4.address }}"
control_plane_port: 6443
