# =============================================================================
# roles/containerd/tasks/main.yml
# =============================================================================
# Install and configure containerd — the Container Runtime.
#
# WHY DOES KUBERNETES NEED A CONTAINER RUNTIME?
#
#   Kubernetes is an ORCHESTRATOR, not a runtime.
#   It schedules WORKLOADS (pods) onto nodes, but it does NOT run them.
#   Something must actually EXECUTE the containers.
#
#   containerd is that "something":
#     - It downloads container images from a registry
#     - It creates container sandboxes (cgroups, namespaces)
#     - It manages container lifecycle (start, stop, restart)
#     - It reports container health back to Kubernetes
#
#   Without containerd, Kubernetes is just a database of desired state
#   with no engine to make it real.
#
#   ANALOGY:
#     Kubernetes   = Air Traffic Controller (directs planes WHERE to land)
#     containerd   = Airport Runway (the actual place where planes land)
#
#   Kubernetes talks to containerd via the CRI (Container Runtime Interface).
# =============================================================================

---
# =============================================================================
# TASK 1: Create containerd directories
# =============================================================================
# Before installing, ensure the required directories exist.
# The 'file' module creates directories (like mkdir -p).
# =============================================================================

- name: Create containerd data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  loop: "{{ containerd_data_dirs }}"
  tags:
    - containerd

# =============================================================================
# TASK 2: Add Docker APT repository (for containerd.io)
# =============================================================================
# The containerd.io package is distributed via Docker's official apt repository,
# NOT through Ubuntu's universe repo. We must add the Docker repo GPG key
# and repository source before apt can install containerd.io (original error:
# "No package matching 'containerd.io' is available").
#
# This step is ONLY needed when install_method is "apt".
# When using "github", the binary is downloaded directly (no repo needed).
#
# Why three sub-tasks?
#   1. Create keyrings directory  —  /etc/apt/keyrings/ may not exist on a
#      minimal Ubuntu install (created by docker.io package, but we haven't
#      installed that yet — chicken-and-egg).
#   2. Download GPG key  —  get_url fetches Docker's official GPG key into
#      the keyrings directory (same pattern as the kubernetes role).
#      Without this, apt refuses to trust the Docker repository.
#   3. Add apt repository   —  apt_repository writes a .sources entry under
#      /etc/apt/sources.list.d/docker.sources and runs apt update.
# =============================================================================

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  when: containerd_install_method == "apt"
  tags:
    - containerd
    - repository

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ containerd_docker_apt_key }}"
    dest: "{{ containerd_docker_keyring }}"
    mode: "0644"
  become: true
  when: containerd_install_method == "apt"
  tags:
    - containerd
    - repository

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "{{ containerd_docker_apt_repo }}"
    state: present
    filename: docker
    update_cache: true
  become: true
  when: containerd_install_method == "apt"
  tags:
    - containerd
    - repository

# =============================================================================
# TASK SET 3: Install containerd via apt (method: apt)
# =============================================================================
# The apt method is the SIMPLEST approach.
# containerd.io is sourced from Docker's apt repository (added in TASK 2).
# This is perfect for a home lab — updates are managed by apt.
# The version may be slightly older than the GitHub release.
# =============================================================================

- name: Install containerd via apt
  ansible.builtin.apt:
    name: "{{ containerd_apt_package }}"
    state: present
    update_cache: true
  become: true
  when:
    - containerd_install_method == "apt"
    - ansible_facts.pkg_mgr == "apt"
  notify: restart containerd
  tags:
    - containerd
    - packages

# =============================================================================
# TASK SET 4: Install containerd via GitHub (method: github)
# =============================================================================
# The GitHub method gives you the LATEST containerd binary.
# It requires more steps:
#   1. Download the tarball from GitHub
#   2. Extract it
#   3. Copy the binary to /usr/local/bin
#   4. Create a systemd service file
#
# Why use 'unarchive' module?
#   It downloads AND extracts in ONE step.
#   It's idempotent — if the file already exists at the destination,
#   it checks if extraction is needed before doing it.
# =============================================================================

- name: Download and extract containerd from GitHub
  ansible.builtin.unarchive:
    src: "{{ containerd_github_url }}"
    dest: "{{ containerd_binary_path }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
  become: true
  when:
    - containerd_install_method == "github"
    - ansible_facts.architecture == "x86_64"
  notify: restart containerd
  tags:
    - containerd

# =============================================================================
# TASK 5: Configure containerd
# =============================================================================
# containerd uses a YAML config file.
# We provide a template (roles/containerd/templates/containerd_config.yml.j2)
# that gets rendered with our variables.
#
# Why use a TEMPLATE instead of a static file?
#   - Templates support Jinja2 expressions: {{ variable }}
#   - Templates can use conditionals, loops, filters
#   - Templates make the config DYNAMIC per environment
#
# The 'template' module:
#   1. Reads the .j2 file
#   2. Replaces all {{ variables }} with their values
#   3. Copies the result to the destination
#   4. Reports 'changed' if the destination file differs
#
# UPDATE: To resolve the Kubernetes CRI plugin error ("unknown service runtime"),
# the template approach has been replaced with dynamic configuration generation
# directly from the containerd binary, ensuring CRI is enabled and SystemdCgroup
# is set appropriately.
# =============================================================================

- name: Generate default containerd config
  ansible.builtin.shell: containerd config default
  register: containerd_config_default
  changed_when: false
  become: true
  tags:
    - containerd
    - config

- name: Write containerd config
  ansible.builtin.copy:
    dest: "{{ containerd_config_path }}"
    content: "{{ containerd_config_default.stdout }}"
    mode: "0644"
    owner: root
    group: root
  become: true
  notify: restart containerd
  tags:
    - containerd
    - config

- name: Set SystemdCgroup to true in containerd config
  ansible.builtin.replace:
    path: "{{ containerd_config_path }}"
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  become: true
  notify: restart containerd
  tags:
    - containerd
    - config

- name: Ensure CRI plugin is not disabled in containerd config
  ansible.builtin.lineinfile:
    path: "{{ containerd_config_path }}"
    regexp: '^\s*disabled_plugins\s*=\s*\["cri"\]'
    state: absent
  become: true
  notify: restart containerd
  tags:
    - containerd
    - config

# =============================================================================
# TASK 6: Start and enable containerd service
# =============================================================================
# The 'service' module manages systemd services.
#
#   state: started   = start the service NOW (if not running)
#   enabled: true    = enable at boot (systemctl enable)
#
# Why separate 'start' from 'enable'?
#   - Ansible can start the service immediately (state: started)
#   - AND ensure it survives reboots (enabled: true)
#   - If you only use 'state: running', the service stops after reboot.
#   - If you only use 'enabled: true', you must reboot to start it.
#
# We use a handler for RESTART (not start) because:
#   - Initial start is always needed
#   - Restart should only happen when config changes
# =============================================================================

- name: Ensure containerd service is running and enabled
  ansible.builtin.systemd:
    name: "{{ containerd_service_name }}"
    state: "{{ containerd_service_state }}"
    enabled: "{{ containerd_service_enabled }}"
    daemon_reload: yes
  become: true
  tags:
    - containerd
    - service