# =============================================================================
# roles/containerd/defaults/main.yml
# =============================================================================
# Default variables for the containerd (Container Runtime) role.
#
# These values can be overridden in group_vars, host_vars, or via -e.
# =============================================================================

---
# ---------------------------------------------------------------------------
# Installation method
# ---------------------------------------------------------------------------
# Options:
#   "apt"     - Install via apt package manager (simpler, older version)
#   "github"  - Download release binary from GitHub (newer, more complex)
#
# For home lab: use "apt" (simpler, works out of the box)
# For production: use "github" (you control the exact binary)
# ---------------------------------------------------------------------------

containerd_install_method: "apt"

# ---------------------------------------------------------------------------
# Docker apt repository settings (for containerd.io)
# ---------------------------------------------------------------------------
# The 'containerd.io' package lives in Docker's apt repository, NOT in Ubuntu's
# universe repo. These vars define how we add that repo (see tasks/main.yml).
# ---------------------------------------------------------------------------
containerd_docker_apt_key: "https://download.docker.com/linux/ubuntu/gpg"
# Docker repo codename — override in group_vars if your nodes report a
# non-standard LSB name (e.g. a custom AWS AMI). Defaulting to jammy.
# Use `ansible all -m setup -a 'filter=ansible_distribution_release'` to check.
containerd_docker_apt_codename: jammy
containerd_docker_apt_repo: "deb [signed-by={{ containerd_docker_keyring }}] https://download.docker.com/linux/ubuntu {{ containerd_docker_apt_codename }} stable"

# ---------------------------------------------------------------------------
# containerd version (used when install_method = "github")
# ---------------------------------------------------------------------------
containerd_version: "1.7.6"

# URL pattern for GitHub releases
containerd_github_url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-amd64.tar.gz"

# ---------------------------------------------------------------------------
# Apt package configuration
# ---------------------------------------------------------------------------
containerd_apt_package: "containerd.io"

# ---------------------------------------------------------------------------
# containerd configuration file path
# ---------------------------------------------------------------------------
# containerd ONLY reads /etc/containerd/config.toml — it NEVER reads a .yml
# file here. The containerd.io package ships a config.toml that disables the
# CRI plugin, which makes `kubeadm init` fail with:
#   "unknown service runtime.v1.RuntimeService"
# The containerd role regenerates this file from `containerd config default`
# and tunes it for Kubernetes (SystemdCgroup = true, CRI enabled).
# ---------------------------------------------------------------------------
containerd_config_path: "/etc/containerd/config.toml"

# ---------------------------------------------------------------------------
# containerd service settings
# ---------------------------------------------------------------------------
containerd_service_name: containerd
containerd_service_state: started
containerd_service_enabled: true

# ---------------------------------------------------------------------------
# containerd runtime directory
# ---------------------------------------------------------------------------
containerd_root: /var/lib/containerd
