# =============================================================================
# roles/kubernetes/defaults/main.yml
# =============================================================================
# Default variables for the Kubernetes role.
# =============================================================================

---
# ---------------------------------------------------------------------------
# Kubernetes version / release channel
# ---------------------------------------------------------------------------
# The Kubernetes apt repository organizes packages by release channel.
# Common channels: stable, beta, nightly
# ---------------------------------------------------------------------------

kubernetes_release: "v1.37"
kubernetes_version: "stable"

# ---------------------------------------------------------------------------
# Official Kubernetes apt repository (pkgs.k8s.io)
# ---------------------------------------------------------------------------
# The old download.kubernetes.io host was deprecated in Sept 2023 and
# has been replaced by pkgs.k8s.io. The new format is distribution-
# agnostic (no more xUbuntu_22.04 per-OS paths). The signed-by option
# is required on Ubuntu 22.04+ for apt to trust the GPG key.
# ---------------------------------------------------------------------------
kubernetes_apt_repo: "deb [signed-by={{ kubernetes_apt_keyring }}] https://pkgs.k8s.io/core:/{{ kubernetes_version }}:/{{ kubernetes_release }}/deb/ /"

# GPG key URL for the Kubernetes apt repository
kubernetes_apt_key: "https://pkgs.k8s.io/core:/{{ kubernetes_version }}:/{{ kubernetes_release }}/deb/Release.key"

# ---------------------------------------------------------------------------
# Packages to install
# ---------------------------------------------------------------------------
kubernetes_packages:
  - kubeadm
  - kubelet
  - kubectl

# ---------------------------------------------------------------------------
# Hold packages at current version (prevent accidental upgrades)
# ---------------------------------------------------------------------------
kubernetes_hold_packages: false

# ---------------------------------------------------------------------------
# kubelet service settings
# ---------------------------------------------------------------------------
kubelet_service_name: kubelet
kubelet_service_state: started
kubelet_service_enabled: true

# ---------------------------------------------------------------------------
# kubelet configuration
# ---------------------------------------------------------------------------
kubelet_config_path: /etc/default/kubelet

# ---------------------------------------------------------------------------
# Additional Kubernetes tools
# ---------------------------------------------------------------------------
kubernetes_extra_packages: []
