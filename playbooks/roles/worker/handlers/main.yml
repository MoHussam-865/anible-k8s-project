# =============================================================================
# roles/worker/handlers/main.yml
# =============================================================================
# Handlers for the Worker role.
# =============================================================================

---
# ---------------------------------------------------------------------------
# Handler: restart kubelet
# ---------------------------------------------------------------------------
# Notified when kubelet configuration changes on a worker.
# ===========================================================================

- name: restart kubelet
  ansible.builtin.service:
    name: kubelet
    state: restarted
  become: true
  listen: "restart kubelet"