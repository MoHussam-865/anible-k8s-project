# =============================================================================
# roles/calico/tasks/main.yml
# =============================================================================
# Install Calico CNI (Container Networking Interface) via its official
# Kubernetes manifest.
#
# =============================================================================
# WHY THIS APPROACH?
# =============================================================================
#
# Older Calico releases shipped standalone CNI binary tarballs that were
# downloaded and extracted onto each node. Starting with Calico v3.26+,
# the project stopped providing those tarballs — the CNI binaries are now
# bundled inside the calico-node container image and automatically deployed
# onto every node by a DaemonSet.
#
# The modern, supported approach is:
#   kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/\
#                      {{ calico_manifest_version }}/manifests/calico.yaml
#
# This single command creates all required resources:
#   - CustomResourceDefinitions (BGPPeer, IPPool, FelixConfiguration, …)
#   - calico-node DaemonSet (installs CNI binaries + config on every node)
#   - calico-kube-controllers Deployment (manages IPAM, policies, etc.)
#   - RBAC roles, ServiceAccounts, ConfigMaps, and more
#
# The command only needs to run ONCE on the control-plane node.
# =============================================================================

---
- name: Install Calico network plugin via manifest
  ansible.builtin.command: >
    kubectl apply -f
    https://raw.githubusercontent.com/projectcalico/calico/{{ calico_manifest_version }}/manifests/calico.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_install_result
  changed_when: '"created" in calico_install_result.stdout or "configured" in calico_install_result.stdout'
  run_once: true
  tags:
    - calico

- name: Display Calico installation result
  ansible.builtin.debug:
    var: calico_install_result.stdout_lines
  run_once: true
  tags:
    - calico
    - verify
